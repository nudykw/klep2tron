[package]
name = "client_core"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", features = ["default", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
image = "0.25"
winit = "0.30"
wgpu = "29"
bevy_framepace = "0.22"
ron = "0.12.1"


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Storage"] }
